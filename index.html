<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainingsbuch</title>
<meta name="theme-color" content="#16201B">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Daumen-App. Oben schmale Kopfzeile, unten feste Navigation (4 Tabs), Details in Sheets von unten. */
:root{
  --bg:#ECEFEC; --surface:#FAFBF9; --sunk:#E2E7E3; --ink:#16201B; --muted:#58665F; --line:#CDD5CF;
  --meal:#B85C1E; --accent:#1D5BB8; --accent-ink:#FFFFFF; --accent-soft:#DAE5F6;
  --good:#23824F; --good-soft:#D7EEDF; --warn:#A87100; --warn-soft:#F6E8C6; --bad:#BC3326; --bad-soft:#F6D9D5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1412; --surface:#171E1B; --sunk:#111815; --ink:#E4EBE7; --muted:#95A39C; --line:#2A3530;
  --accent:#6FA1EE; --accent-ink:#0A1322; --accent-soft:#1A2943;
  --meal:#EE9A5C; --good:#5BC489; --good-soft:#163323; --warn:#E3B13E; --warn-soft:#3A2E10; --bad:#EE6B5E; --bad-soft:#3D1A16; color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:26px;text-transform:uppercase}
h2{font-size:20px;text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 2px;max-width:640px;margin:0 auto;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--accent-soft);white-space:nowrap}
.pill.warn{background:var(--warn-soft)}
#syncLine{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;max-width:640px;margin:6px auto 0;width:100%;background:var(--warn-soft);border-radius:10px;padding:6px 10px}
#syncLine[hidden]{display:none}
.hright{display:flex;align-items:center;gap:8px}
.syncb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--good);padding:0}
.syncb[data-state="busy"]{color:var(--muted)}
.syncb[data-state="bad"]{color:var(--bad);border-color:var(--bad)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 16px);z-index:60;max-width:600px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;border:1px solid transparent}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}
.banner.good{background:var(--good-soft);border-color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=password],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{width:100%;padding:13px 16px;font-size:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;min-height:40px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.devs button{padding:10px 14px}
.chips.devs button[aria-pressed="true"]{background:var(--good-soft);color:var(--ink);border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.chips.devs button[aria-pressed="false"]{opacity:.6;border-style:dashed}
.chips.sm button{padding:5px 11px;font-size:.92em}
.shopopts .calnav{margin:0 0 4px}.shopopts .lab{margin-top:8px}
.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}.btnrow .btn{width:100%}
.acl{margin-top:6px}
.zgrp{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:8px 0}.zgrp button{flex:none}
.ingg.zp .ih,.ingg.zp .ir{grid-template-columns:minmax(0,1fr) 72px 64px}.ingg .ir.sel{font-weight:700}
.ingg{display:flex;flex-direction:column;margin-top:6px;font-size:14px}
.ingg .ih,.ingg .ir{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.ingg.zg .ih,.ingg.zg .ir{grid-template-columns:var(--zc, minmax(0,1fr) 64px 52px)}
.ingg .num.cheap{color:var(--good);font-weight:700}
.zst{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.zst button{flex:none}
.zw{display:flex;flex-direction:column;margin-top:6px}
.zw .zwh,.zw .zwp{display:grid;grid-template-columns:repeat(var(--zn),minmax(0,1fr));gap:2px;text-align:right;font-variant-numeric:tabular-nums}
.zw .zwh{position:sticky;top:0;z-index:2;background:var(--bg);font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.zw .zwr{display:flex;flex-direction:column;gap:2px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;width:100%}
.zw .zwn{font-size:14px}.zw .zwp{font-size:12.5px}.zw .zwp .cheap{color:var(--good);font-weight:700}
.zw .zwr.sum{font-weight:700}.zw .ig{padding:10px 0 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ingg .ih{font-size:12px;color:var(--muted);font-weight:600}
.ingg .ir > span{min-width:0;overflow-wrap:anywhere}
.ingg button.ir{border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;width:100%}
.ingg .amt{color:var(--muted);font-variant-numeric:tabular-nums}
.ingg .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ingg .ig{padding:10px 2px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ingg .ir.home{opacity:.65}.ingg .ir.sum{font-weight:700;border-bottom:0}
dialog.swapmode{background:color-mix(in srgb, var(--warn-soft) 55%, var(--bg));border-top:3px solid var(--warn)}
.swapbar{margin:-4px 0 8px;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:14px}
details.shopview{margin-top:6px}details.shopview > summary{cursor:pointer;color:var(--accent);padding:4px 0}
.rhero{display:flex;flex-direction:column;gap:6px}
.rhero .rimg{width:100%;max-height:190px;object-fit:cover;border-radius:14px}
.rfacts{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.rnut{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px}.rnut b{font-size:18px}
details.rprice summary{cursor:pointer;font-size:14px;list-style:none}details.rprice summary::-webkit-details-marker{display:none}details.rprice summary::after{content:" ›";color:var(--muted)}
details.rprice[open] summary::after{content:" ⌄"}details.rprice .storecmp{margin-top:6px}
.rsteps{padding-left:22px;margin:8px 0}.rsteps li{margin:8px 0;line-height:1.45}
.rinfo{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ingt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px;margin-top:6px}
.ingt th:first-child,.ingt td.amt{width:72px}.ingt th.num,.ingt td.num{width:68px}
.ingt td{overflow-wrap:anywhere}
.ingt th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.ingt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.ingt td.amt{color:var(--muted);font-variant-numeric:tabular-nums}
.ingt .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ingt tr.grp td{background:var(--surface);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:10px}
.ingt tr.home td{opacity:.65}
.ingt tfoot td{font-weight:700;border-bottom:0}
.nwest{margin:8px 0;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.nwrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}.nwrow.miss span:first-child{color:var(--warn)}.nwrow.sum{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.restmini{position:sticky;top:0;z-index:5;margin:-4px 0 8px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:14px;text-align:center}
.restmini.over{background:var(--good-soft)}
.gaphint{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warn-soft)}
.rsrow{padding:8px}.rsrow .lrow{border:0;padding:0;background:none}.rsrow .btn{margin-top:6px}
.fsbox ol{margin:6px 0 0;padding-left:20px}.fsbox li{margin:3px 0}
.stockrow{margin:8px 0 2px}.acl:empty{display:none}.acl button{padding:4px 12px;font-weight:500}
.lrow.sel{border-color:var(--good);background:var(--good-soft)}

/* Heute: Aufgabenliste */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead .nav{display:flex;align-items:center;gap:2px}
.dayhead .nav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:18px}
.dayhead h2{font-size:22px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph .btn{width:100%;padding:8px 6px}
.phbox{aspect-ratio:3/4;background:var(--sunk);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;padding:0;width:100%;color:var(--muted);font-size:12px;text-align:center}
.phbox img{width:100%;height:100%;object-fit:cover;display:block}
.phcap{font-size:12px;font-weight:600;color:var(--muted)}
.phbig{width:100%;border-radius:12px;display:block}
.calnav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.calnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:44px;font-size:18px}
.calnav .ttl{text-align:center;font-weight:600}
.agday{display:flex;flex-direction:column;gap:6px}
.agday h3{margin:6px 0 0;font-size:14px;display:flex;gap:8px;align-items:center}
.agday.today h3{color:var(--accent)}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;width:100%;color:var(--ink);text-decoration:none;font:inherit}
.ev .tm{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.ev .ti{min-width:0;overflow-wrap:anywhere}
.ev .ti small{display:block;color:var(--muted)}
.ev.train{border-left-color:var(--accent)}
.ev.routine{border-left-color:var(--good)}
.ev.boulder{border-left-color:var(--good)}
.ev.marker{border-left-color:var(--warn)}
.dlink{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:700}
.dgrid{position:relative;margin-top:4px}
.dgrid .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.dgrid .hr span{position:absolute;top:-8px;left:0;font-family:var(--f-num);font-size:11px;color:var(--muted);background:var(--bg);padding-right:4px}
.dgrid .now{position:absolute;left:40px;right:0;border-top:2px solid var(--bad);z-index:2}
.gev{position:absolute;overflow:hidden;border-radius:8px;padding:3px 6px;font-size:12px;line-height:1.25;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);color:var(--ink);text-decoration:none}
.gev span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gev.train{border-left-color:var(--accent);background:var(--accent-soft)}
.gev.routine{border-left-color:var(--good)}
.gev.done b{text-decoration:line-through}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.mgrid .h{color:var(--muted);font-weight:600;font-size:12px}
.mc{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font:inherit}
.mc .dn{font-family:var(--f-num);font-size:12px}
.mc.t{border-color:var(--accent);border-width:2px}
.mc.mk{background:var(--warn-soft)}
.mc .tr{font-size:10px;font-family:var(--f-num);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 4px;max-width:100%;overflow:hidden}
.mc .tr.done{background:var(--good);color:#fff}
.mc .tr.miss{background:var(--sunk);color:var(--muted)}
.mc .bo{font-size:10px;font-weight:700;color:var(--good)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle}
.lg.tr{background:var(--accent)} .lg.bo{background:var(--good)} .lg.mk{background:var(--warn-soft);border:1px solid var(--warn)}
.ev.done .ti b{text-decoration:line-through;text-decoration-thickness:1px}
.ev .st{font-size:12px;color:var(--muted)}
.ev.done .st{color:var(--good)}
.storecmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.storecmp div{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:12px;background:var(--surface)}
.storecmp div b{font-family:var(--f-num);font-size:14px}
.budget .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.budget .fill{height:100%;background:var(--good)}
.budget.over .fill{background:var(--warn)}
.mwarn{font-size:12px;color:var(--bad);font-weight:600}
.storecmp div .muted{font-size:10px}
.storecmp .best{border-color:var(--good);background:var(--good-soft)}
.storecmp .sel span{font-weight:700;text-decoration:underline}
.price{color:var(--ink);font-weight:600}
.nonutri .nutri,.nonutri .mbar,.nonutri .macro{display:none !important}
.ownf{background:var(--sunk)}
body.wo nav.bottom{display:none}
body.wo header.top,body.wo #syncLine{display:none}
body.wo .wohead{padding:calc(env(safe-area-inset-top,0px) + 6px) 0 8px;margin-bottom:4px}
.wohead .woback{min-width:44px;min-height:44px;font-size:24px;padding:0 6px;flex:none}
.wot{flex:1;min-width:0;display:flex;flex-direction:column}
.wot h2{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scnote{color:var(--bad)}
body.wo .exdots{gap:5px}
body.wo .exdots button{width:34px;height:34px}
.fxname{font-size:26px;line-height:1.15;text-transform:none}
body.wo .focusex .anim{max-height:220px}
body.wo .focusex .anim img{max-height:220px}
body.wo .restbar{bottom:env(safe-area-inset-bottom,0px)}
body.wo main{padding-bottom:110px}
.woback{padding:4px 0;margin-bottom:2px}
.exdots{display:flex;gap:6px;flex-wrap:wrap}
.exdots button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);padding:0}
.exdots .cur{border-color:var(--accent);color:var(--accent)}
.exdots .ok{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.exdots .off{opacity:.4}
.focusex{display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.fxhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fxhead h2{margin:2px 0 0}
.focusex .anim{max-height:150px}
.focusex .anim img{max-height:150px;object-fit:contain}
.fxnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warm{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.warm summary{font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
.sumhero{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.sumhero .trophy{font-size:56px}
.sumhero .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.prs{display:flex;flex-direction:column;gap:6px;text-align:left}
.pr{display:flex;flex-direction:column;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.gtimer{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px}
.gt{font-family:var(--f-num);font-size:44px;font-weight:700}
.ptitle{margin:4px 0 0}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.subhead h2{margin:0}
.chips.focus{justify-content:center;margin:2px 0 8px}.esum{margin:8px 2px}

[data-swipe=day]{touch-action:pan-y}
[data-swipe=meal]{touch-action:pan-y;position:relative;transition:transform .18s}
[data-swipe=meal].swiping{transition:none;background:var(--surface);transform:translateX(calc(var(--dx) * 1px));z-index:1}
[data-swipe=meal]::before,[data-swipe=meal]::after{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 14px;font-weight:700;opacity:0;pointer-events:none;border-radius:10px;white-space:nowrap}
[data-swipe=meal]::before{content:attr(data-swr);right:100%;width:calc(var(--dx, 0) * 1px);overflow:hidden;justify-content:center;background:var(--good-soft);color:var(--good)}
[data-swipe=meal]::after{content:attr(data-swl);left:100%;width:calc(var(--dx, 0) * -1px);overflow:hidden;justify-content:center;background:var(--warn-soft);color:var(--warn)}
[data-swipe=meal].sw-r::before,[data-swipe=meal].sw-l::after{opacity:1}
[data-swipe=meal].swiping.sw-r{background:var(--good-soft);box-shadow:inset 4px 0 0 var(--good)}
[data-swipe=meal].swiping.sw-l{background:var(--warn-soft);box-shadow:inset -4px 0 0 var(--warn)}
[data-swipe=meal].sw-go::before{background:var(--good);color:#fff}
[data-swipe=meal].sw-go::after{background:var(--warn);color:#fff}
[data-swipe=meal].flash{animation:mflash .7s ease-out}

.toggle[aria-pressed="true"]{background:var(--good)}
.toggle[aria-pressed="true"]::after{left:23px}

.weekstrip b{display:block;font-family:var(--f-display);font-size:14px}

/* Training */
.wohead{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.wohead .clock{font-family:var(--f-num);font-size:15px}
.exl{display:flex;flex-direction:column;gap:8px}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.exrow.cur{border:2px solid var(--accent)}
.exrow.complete{opacity:.75}
.exsum{display:grid;grid-template-columns:24px 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;width:100%;background:none;border:0;text-align:left;min-width:0}
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.exhead .exalt{margin-right:8px;font-size:18px;padding:6px 10px}
.exth{width:52px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sunk)}
.exth img{width:100%;height:100%;object-fit:cover;display:block}
.exrow.cur .exth{display:none}
.exrow.cur .exsum{grid-template-columns:24px minmax(0,1fr) auto}
.pvlist{display:flex;flex-direction:column}
.pv{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pv:last-child{border-bottom:0}

.pvimg img{width:100%;height:100%;object-fit:cover;display:block}
.pvimg .noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--f-display);font-size:22px;color:var(--muted)}
.pvt{min-width:0;line-height:1.35}
.pvalt{white-space:nowrap}
.exsum .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.exrow.complete .st{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.exsum .nm{font-weight:600;min-width:0}
.exsum .pr{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.exbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.anim{position:relative;margin:0;border-radius:10px;overflow:hidden;background:#1d2421;aspect-ratio:16/9;border:0;padding:0;width:100%;display:block}
.anim:has(img[src*="/r/"]){background:#dcf0fa}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim img.b{animation:flip 3s steps(1,end) infinite}
.anim.still .ph,.anim.still img.b{display:none}
.anim .ph{position:absolute;left:8px;top:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.anim .ph.a{animation:flipA 3s steps(1,end) infinite}
.anim .ph.b{animation:flip 3s steps(1,end) infinite}
.anim img{z-index:1}
@keyframes flipA{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
.anim.paused img.b,.anim.paused .ph,.anim.paused::after{animation-play-state:paused}
.anim.paused::after{display:none}
.anim:has(img[src*="/r/"]){aspect-ratio:4/3}
.anim.still::after{display:none}
.anim .hint{z-index:2;position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
@keyframes flip{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.anim img.b{animation:none;opacity:0}}
.target{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.target b{font-family:var(--f-num);font-weight:500}

.sethead span:last-child{text-align:center}
.setrow .prev{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow .i{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:center}
.setrow input{text-align:center;font-family:var(--f-num);font-size:16px;padding:10px 4px}
.setrow .x{color:var(--muted);text-align:center}
.setrow .ok{height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;color:var(--muted)}
.setrow.isdone .ok{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.setrow.isdone input{background:var(--good-soft);border-color:transparent}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);color:var(--ink);border-top:3px solid var(--accent);box-shadow:0 -4px 16px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}

.restbar.over{background:var(--good);color:var(--accent-ink);border-top-color:var(--good)}

/* Fortschritt */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:128px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:13px}

.chart{width:100%;height:auto;display:block}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}

td.n{font-family:var(--f-num);text-align:right}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}

/* Skalen, Checks, Sheets */
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}

.scale button.y[aria-pressed="true"]{background:var(--warn);color:var(--accent-ink);border-color:var(--warn)}
.scale button.r[aria-pressed="true"]{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}

.zt{font-size:17px;line-height:1.45}

.zn{display:flex;justify-content:space-between}

.mobimg .anim{aspect-ratio:3/2}

dialog.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
dialog.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}

.rec summary{list-style:none;cursor:pointer;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rec summary::-webkit-details-marker{display:none}
.rec .rb{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rec ul,.rec ol,.card ul,.card ol,.sb ul{margin:0;padding-left:20px}
.macro{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center}
.macro span{border:1px solid var(--line);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;line-height:1.2}
.macro b{color:var(--ink);font-weight:700;font-family:var(--f-num);font-size:15px}
code.copy{display:block;background:var(--sunk);padding:8px 10px;border-radius:8px;font-family:var(--f-num);font-size:12px;overflow-wrap:anywhere}
.coach{background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.coach .ct{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.tl{display:flex;flex-direction:column;margin-left:4px}
.stage{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.stage::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:var(--bg);z-index:1}
.stage.done .dot{background:var(--good);border-color:var(--good)}
.stage.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stage .sbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.sh2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mss{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.ms{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ms.done{color:var(--muted)} .ms.lock{opacity:.6}
.quiz{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

.qa.right{background:var(--good-soft);border-color:var(--good)} .qa.wrong{background:var(--bad-soft);border-color:var(--bad)}

.rcard .noimg{display:grid;place-items:center;font-size:40px}
.mthumb.ph{font-size:22px}
.rcard .rt{font-weight:600;font-size:14px;padding:0 10px;line-height:1.25}
.rcard .rm{font-size:12px;color:var(--muted);padding:0 10px}

.rimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.task[disabled]{opacity:.55}

.tb .menu{font-size:22px;line-height:1;padding:4px 12px}

.tb.rest{background:var(--sunk);border-style:dashed}
.pillst{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:2px 10px;margin-bottom:6px;background:var(--line);color:var(--ink)}

.sec{margin-top:4px}
ol.prev{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ol.prev li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
ol.prev li:last-child{border-bottom:0}
.btn.danger{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
.finbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--good-soft);border:1px solid var(--good);border-radius:14px;padding:12px 14px}
.stage.fold .sbody{gap:0}
.stagebtn{border:0;background:none;padding:0;text-align:left;width:100%;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cal button.c{border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
.exl{gap:10px}.exbody{gap:12px}.setrow{gap:10px}.weekstrip{gap:6px}
.altopt{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;width:100%}
.altopt.sel{border:2px solid var(--accent)}
.athumb .anim{aspect-ratio:4/3}
.athumb.noimg{display:block;aspect-ratio:4/3;background:var(--sunk);border-radius:8px}

    "Fortschritt im Kraftsport ist langsam. Im Spiegel siehst du ihn kaum, in Zahlen schon. Deshalb sammelst du in Woche 0 Ausgangswerte.",
    "• Taille und Hals ergeben über die Navy-Formel eine Körperfett-Schätzung. Die ist ungenau (±3,5 %), aber der Trend zählt.",
    "• Fotos von vorn, seitlich und hinten zeigen Haltung und Form. Immer gleicher Ort, gleiches Licht, gleicher Abstand.",
    "• Klimmzüge und Beinpresse-10RM sind deine Kraft-Basis.",
    "Kleine Änderungen sind Rauschen: Beckenwinkel unter 3–4°, Gewicht von Woche zu Woche. Ohne Waage zuhause wiegst du 1× pro Woche im Gym. Bewertet wird der Trend über mehrere Wochen, vor allem zusammen mit dem Bauchumfang."],
    quiz:{q:"Dein Gym-Gewicht ist 0,8 kg höher als letzte Woche. Was bedeutet das?", a:["Fett zugenommen","Normale Schwankung (Wasser, Essen, Kleidung)","Der Plan funktioniert nicht"], c:1, why:"Einzelmessungen schwanken durch Wasser, Mageninhalt und Kleidung. Aussagekräftig ist der Trend über 3–4 Wochen plus Bauchumfang."}},
  {id:"l1", week:1, title:"RIR: Wie hart ist hart genug?", min:4, body:[
    "RIR heißt „Reps in Reserve“: Wie viele Wiederholungen wären noch gegangen? RIR 3 bedeutet, du hörst auf, wenn noch 3 saubere Wdh. drin wären.",
    "Muskeln wachsen am besten, wenn Sätze nah ans Muskelversagen gehen. Komplettes Versagen bringt aber kaum mehr und kostet viel Erholung.",
    "• Die meisten unterschätzen ihre Reserve um etwa 1 Wdh., bei hohen Wiederholungszahlen noch mehr.",
    "• Deshalb startest du mit RIR 3 und kalibrierst dein Gefühl.",
    "• Grundübungen nie bis zum Versagen, Isolation an Maschinen später schon (RIR 0–1)."],
    quiz:{q:"Du schaffst 12 Wdh. und hättest noch 2 geschafft. Welcher RIR?", a:["RIR 0","RIR 2","RIR 12"], c:1, why:"2 Wiederholungen waren noch in Reserve, also RIR 2."}},
  {id:"l2", week:2, title:"Doppelte Progression", min:3, body:[
    "So wirst du Woche für Woche stärker, ohne zu raten:",
    "• Jede Übung hat einen Wiederholungsbereich, z. B. 8–12.",
    "• Du steigerst erst die Wiederholungen. Schaffst du in allen Sätzen 12 beim geplanten RIR, kommt die nächste Gewichtsstufe.",
    "• Mit dem neuen Gewicht startest du wieder bei 8.",
    "Studien zeigen: Mehr Wiederholungen oder mehr Gewicht bringen beide ähnliches Muskelwachstum. Wichtig ist nur, dass es mehr wird. Der grüne ↑-Hinweis in der App rechnet das für dich aus."],
    quiz:{q:"Ziel 3 × 8–12. Letztes Mal: 12, 12, 11. Was ist heute dran?", a:["Gewicht erhöhen","Gleiches Gewicht, versuchen auf 12/12/12","Weniger Sätze"], c:1, why:"Erst wenn alle Sätze das obere Ende erreichen, geht das Gewicht hoch."}},
  {id:"l3", week:3, title:"Hängende Schultern verstehen", min:5, body:[
    "Bei hängenden Schultern steht das Schulterblatt tief und ist nach unten gedreht. Das ist etwas anderes als runde Schultern.",
    "• Der obere Trapezius ist meist zu lang und zu schwach, nicht verspannt. Deshalb nicht dehnen.",
    "• Der Klassiker „Schultern runter und zurück“ verstärkt das Problem. Besser: Schlüsselbeine breit und leicht hoch, Schulterblätter nach oben-außen drehen.",
    "• Was hilft: 30°-Shrugs mit Halt oben, Serratus-Arbeit (Push-up Plus), später Überkopf-Shrugs. Optisch macht vor allem mehr Trapezius-Masse einen Unterschied, realistisch nach 3–6 Monaten.",
    "Knochenbau (Halslänge, Schlüsselbein) lässt sich nicht ändern. Haltung erklärt Schmerzen nur schwach, Kraft hilft trotzdem."],
    quiz:{q:"Welcher Cue passt zu hängenden Schultern?", a:["Schultern runter und zurück","Schlüsselbeine breit, Schulterblätter nach oben-außen","Trapez dehnen"], c:1, why:"Die Schulterblätter stehen schon zu tief. Ziel ist Aufwärtsrotation, nicht noch mehr Senken."}},
  {id:"l4", week:4, title:"Beckenkipp: was normal ist", min:4, body:[
    "Rund 85 % der gesunden Männer haben einen vorderen Beckenkipp, im Mittel etwa 9°. „0° ist neutral“ ist ein Mythos.",
    "• Ein Zusammenhang mit Rückenschmerzen ist kaum belegt.",
    "• Training ändert den Winkel nur um 2–4°, das liegt im Messfehler. Erreichbar sind Kontrolle, Hüftstreckung und Rumpfkraft.",
    "• Deshalb stecken Hip Thrust, Split Squats, Dead Bug und die Hüftbeuger-Dehnung schon in deinem Plan.",
    "Ziel ist nicht ein „gerades“ Becken, sondern dass du es aktiv nach vorn und hinten kippen kannst."],
    quiz:{q:"Dein Beckenwinkel ändert sich in 6 Wochen um 2°. Wie bewertest du das?", a:["Großer Erfolg","Messrauschen, Kraft und Kontrolle zählen mehr","Training wirkungslos"], c:1, why:"Änderungen unter 3–4° liegen im Messfehler."}},
  {id:"l5", week:5, title:"Dein Knie: Belastung steuern", min:5, body:[
    "Am wahrscheinlichsten ist ein patellofemorales Schmerzsyndrom: Überlastung durch monatelanges Wandern ohne Pausen bei zu wenig Bein- und Hüftkraft.",
    "• Kraft für Hüfte und Quadrizeps wirkt am besten (starke Evidenz). Bandagen, Laser & Co. nicht.",
    "• Step-Downs sind die wichtigste Übung fürs Bergabgehen.",
    "• Entscheidend für das Risiko ist die längste Einzeleinheit: höchstens etwa 10 % länger als die längste der letzten 30 Tage.",
    "• Ampel: 0–2 grün. 3–5 okay, wenn der Morgentest am nächsten Tag wieder auf Ausgangsniveau ist. Über 5 rot."],
    quiz:{q:"Deine längste Wanderung im letzten Monat war 2 h. Wie lang darf die nächste maximal sein?", a:["etwa 2 h 10 min","4 h","egal, wenn es nicht wehtut"], c:0, why:"Etwa 10 % mehr als die längste Einheit der letzten 30 Tage."}},
  {id:"l6", week:6, title:"Deload: Pause, die stärker macht", min:3, body:[
    "Diese Woche halbierst du die Sätze und trainierst mit RIR 3–4. Das fühlt sich zu leicht an, und genau das ist der Punkt.",
    "• Ermüdung baut sich über Wochen auf und verdeckt deinen echten Fortschritt.",
    "• Ein Deload kostet keine Muskeln. Studien sahen sogar nach einer Woche Pause kein geringeres Wachstum.",
    "• Nutze die Woche zum Messen, für Fotos und den Re-Test."],
    quiz:{q:"Im Deload fühlt sich alles leicht an. Was tun?", a:["Doch mehr Sätze machen","Locker bleiben, das ist geplant","Training ausfallen lassen"], c:1, why:"Der Deload wirkt nur, wenn er wirklich locker ist."}},
  {id:"l7", week:7, title:"Schlüsselbein: Teil-Schonung statt Pause", min:4, body:[
    "Schmerz am Schlüsselbein-Brustbein-Gelenk bei Dips und Überkopf ist meist eine Überlastungsreizung. Abklären lassen musst du ihn trotzdem.",
    "• Standard ist Teil-Schonung: Auslöser weglassen, alles andere weiter trainieren. Komplette Ruhe ist nicht besser.",
    "• SC-Ampel: 0–2 okay, ab 3 die Übung tauschen.",
    "• Keine Schmerzmittel vor dem Training, sonst funktioniert die Ampel nicht.",
    "• Nach der Freigabe kommt der Wiedereinstieg in Stufen: erst Landmine, dann Schrägbank, dann Schulterdrücken. Dips nie tiefer als Oberarm parallel."],
    quiz:{q:"Die Schulter zeigt bei Latzug 3/10. Was jetzt?", a:["Durchziehen","Übung tauschen (z. B. Kabelrudern)","Training abbrechen und eine Woche pausieren"], c:1, why:"Ab 3/10 wird bei der SC-Ampel getauscht, der Rest geht weiter."}},
  {id:"l8", week:8, title:"Protein vegetarisch, ohne Pulver", min:4, body:[
    "Dein Ziel sind 140 g Protein am Tag, etwa 1,9 g pro kg. Über 1,6 g/kg flacht der Nutzen ab, der Rest ist Puffer.",
    "• 4 Mahlzeiten mit je 30–40 g, jeweils mit einer hochwertigen Quelle: Quark/Skyr, Ei, Soja oder Milch.",
    "• Günstig und stark: Magerquark (12 g/100 g), Sojagranulat, Linsen, Harzer.",
    "• Vegetarisch ist kein Nachteil: Bei gleicher Menge Protein wachsen Muskeln gleich gut.",
    "• Das „anabole Fenster“ von 30 Minuten nach dem Training ist ein Mythos."],
    quiz:{q:"Welches Frühstück bringt dich am ehesten auf 30–40 g Protein?", a:["Brötchen mit Marmelade","Overnight Oats mit 300 g Skyr","Müsli mit Hafermilch"], c:1, why:"300 g Skyr liefern allein etwa 33 g Protein."}},
  {id:"l9", week:9, title:"Schlaf und Stress", min:3, body:[
    "Muskeln wachsen in der Erholung, nicht im Gym.",
    "• Ziel: 7 Stunden Schlaf oder mehr, feste Aufstehzeit ±30 min, Koffein spätestens 8 h vor dem Schlafen.",
    "• Eine Nacht ohne Schlaf senkt die Muskelproteinsynthese um etwa 18 %.",
    "• Nach einer schlechten Nacht trotzdem trainieren, aber 1–2 Sätze weniger und RIR +1.",
    "• Prüfungsphase? Modus „reduziert“: 2 Einheiten, weniger Sätze, Lasten bleiben. So hältst du deine Kraft."],
    quiz:{q:"Prüfungswoche, Stress 8/10. Was ist sinnvoll?", a:["Training komplett aussetzen","Modus „reduziert“: 2 kurze Einheiten","Mehr trainieren zum Abschalten"], c:1, why:"Mit wenig Volumen und gleicher Intensität bleiben Kraft und Muskeln erhalten."}},
  {id:"l10", week:10, title:"Nie zweimal auslassen", min:3, body:[
    "Eine Gewohnheit braucht im Schnitt 66 Tage, nicht 21. Einzelne Aussetzer schaden kaum, Serien schon.",
    "• Regel: nie zwei geplante Einheiten hintereinander ausfallen lassen.",
    "• Verpasstes wird nicht nachgeholt, sondern verschoben. Der Planer macht das automatisch.",
    "• Wenn-Dann-Pläne wirken: „Wenn die Vorlesung um 17 Uhr endet, dann gehe ich direkt ins Gym.“",
    "• 2-Minuten-Regel an schlechten Tagen: umziehen und einen Satz machen."],
    quiz:{q:"Du hast gestern ausgelassen. Was ist heute am wichtigsten?", a:["Doppelt so viel trainieren","Heute wenigstens kurz trainieren","Bis nächste Woche warten"], c:1, why:"Einmal ist egal, zweimal ist der Anfang vom Abbruch."}},
  {id:"l11", week:11, title:"Bouldern und Krafttraining", min:4, body:[
    "Bouldern ergänzt dein Training, ersetzt aber kein Rückentraining im Gym.",
    "• Weißt du es vorher: am Tag vor dem Bouldern kein schweres Bein- oder Zugtraining. Spontan nach schwerem Training: nur locker und statisch klettern, früh aufhören.",
    "• Am Tag danach kein schweres Ziehen (der Planer legt dann keine Oberkörper-Einheit).",
    "• Bis zur Arztfreigabe: keine Dynos, Mantles, Compression-Züge. Offene Griffe, bei Ermüdung aufhören.",
    "• Knie: keine extremen Drop Knees und keine maximalen Heel Hooks, solange das Knie gereizt ist. Ein Pop mit Schmerz hinten am Knie gehört abgeklärt.",
    "• Nach dem Bouldern 10 min Antagonisten (Push-up Plus, Außenrotation, Reverse Wrist Curls) gegen Schulter- und Ellbogenprobleme.",
    "• Ein „Pop“ im Finger mit Schwellung muss abgeklärt werden."],
    quiz:{q:"Morgen willst du bouldern. Was passt heute?", a:["Schwere Klimmzüge","Ruhetag oder nur die Korrektiv-Routine","Schwere Beineinheit"], c:1, why:"Am Tag vor dem Bouldern weder schweres Ziehen noch schwere Beine: Beides erhöht das Verletzungsrisiko an der Wand."}},
  {id:"l12", week:12, title:"Wie geht es nach Woche 12 weiter?", min:3, body:[
    "Glückwunsch: ein kompletter Block. Jetzt vergleichst du mit Woche 0: Maße, Fotos, Kraft, Schmerztrend.",
    "• Nächster Block: gleiche Struktur, Übungen mit Fortschritt behalten, stagnierende tauschen.",
    "• Ernährung: ab jetzt Lean Bulk mit etwa +200–250 kcal, Ziel +0,5–1 kg pro Monat.",
    "• Wächst die Taille über 1 cm pro Monat ohne Kraftzuwachs, wieder 150 kcal runter.",
    "• Mit Arztfreigabe kommen Überkopf und Dips stufenweise dazu."],
    quiz:{q:"Du nimmst 2 kg im Monat zu, die Kraft stagniert. Was tun?", a:["Weiter so","Etwa 150 kcal weniger","Mehr Protein-Pulver"], c:1, why:"Mehr als 1,5 kg pro Monat ist überwiegend Fett."}},

function lineChart(series, o){
  const W = 640, H = 190, L = 36, R = 12, T = 12, B = 26, xs = o.dates, n = xs.length;
  const all = series.flatMap(s => s.pts.map(p => p.v)).filter(v => v != null);
  if (!all.length) return `<p class="muted small" style="margin:0">${esc(o.empty)}</p>`;
  let lo_ = o.min ?? Math.min(...all), hi = o.max ?? Math.max(...all); if (hi - lo_ < 1) { lo_ -= .5; hi += .5; }
  const X = i => L + (n === 1 ? 0 : i/(n-1)) * (W-L-R), Y = v => T + (1 - (v-lo_)/(hi-lo_)) * (H-T-B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  for (const t of (o.ticks || [lo_,(lo_+hi)/2,hi])) s += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${Number.isInteger(t) ? t : t.toFixed(1)}</text>`;
  [0, Math.floor((n-1)/2), n-1].forEach(i => s += `<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-size="11" fill="var(--muted)">${fmt(xs[i]).slice(3)}</text>`);
  for (const se of series) { const pts = se.pts.map((p,i) => p.v == null ? null : [X(i), Y(p.v)]);
    if (se.dots) pts.forEach(p => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${se.color}" opacity=".45"/>`; });
    if (se.line) { let d = "", on = false; pts.forEach(p => { if (!p) { on = false; return; } d += (on ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); on = true; }); s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`; const lp = [...pts].reverse().find(Boolean); if (lp) s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${se.color}"/>`; } }
  return s + `</svg>`;
}
