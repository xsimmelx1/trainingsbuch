<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainingsbuch</title>
<meta name="theme-color" content="#16201B">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Daumen-App. Oben schmale Kopfzeile, unten feste Navigation (4 Tabs), Details in Sheets von unten. */
:root{
  --bg:#ECEFEC; --surface:#FAFBF9; --sunk:#E2E7E3; --ink:#16201B; --muted:#58665F; --line:#CDD5CF;
  --meal:#B85C1E; --accent:#1D5BB8; --accent-ink:#FFFFFF; --accent-soft:#DAE5F6;
  --good:#23824F; --good-soft:#D7EEDF; --warn:#A87100; --warn-soft:#F6E8C6; --bad:#BC3326; --bad-soft:#F6D9D5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1412; --surface:#171E1B; --sunk:#111815; --ink:#E4EBE7; --muted:#95A39C; --line:#2A3530;
  --accent:#6FA1EE; --accent-ink:#0A1322; --accent-soft:#1A2943;
  --meal:#EE9A5C; --good:#5BC489; --good-soft:#163323; --warn:#E3B13E; --warn-soft:#3A2E10; --bad:#EE6B5E; --bad-soft:#3D1A16; color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:26px;text-transform:uppercase}
h2{font-size:20px;text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 2px;max-width:640px;margin:0 auto;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--accent-soft);white-space:nowrap}
.pill.warn{background:var(--warn-soft)}
#syncLine{font-size:11px;color:var(--muted);text-align:right;max-width:640px;margin:0 auto;width:100%;min-height:16px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;border:1px solid transparent}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}
.banner.good{background:var(--good-soft);border-color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=password],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{width:100%;padding:13px 16px;font-size:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Heute: Aufgabenliste */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead .nav{display:flex;align-items:center;gap:2px}
.dayhead .nav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:18px}
.dayhead h2{font-size:22px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph .btn{width:100%;padding:8px 6px}
.phbox{aspect-ratio:3/4;background:var(--sunk);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;padding:0;width:100%;color:var(--muted);font-size:12px;text-align:center}
.phbox img{width:100%;height:100%;object-fit:cover;display:block}
.phcap{font-size:12px;font-weight:600;color:var(--muted)}
.phbig{width:100%;border-radius:12px;display:block}
.calnav{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:8px;align-items:center}
.calnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;font-size:18px}
.calnav .ttl{text-align:center;font-weight:600}
.agday{display:flex;flex-direction:column;gap:6px}
.agday h3{margin:6px 0 0;font-size:14px;display:flex;gap:8px;align-items:center}
.agday.today h3{color:var(--accent)}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;width:100%;color:var(--ink);text-decoration:none;font:inherit}
.ev .tm{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.ev .ti{min-width:0;overflow-wrap:anywhere}
.ev .ti small{display:block;color:var(--muted)}
.ev.train{border-left-color:var(--accent)}
.ev.routine{border-left-color:var(--good)}
.ev.boulder{border-left-color:var(--good)}
.ev.marker{border-left-color:var(--warn)}
.dlink{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:700}
.dgrid{position:relative;margin-top:4px}
.dgrid .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.dgrid .hr span{position:absolute;top:-8px;left:0;font-family:var(--f-num);font-size:11px;color:var(--muted);background:var(--bg);padding-right:4px}
.dgrid .now{position:absolute;left:40px;right:0;border-top:2px solid var(--bad);z-index:2}
.gev{position:absolute;overflow:hidden;border-radius:8px;padding:3px 6px;font-size:12px;line-height:1.25;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);color:var(--ink);text-decoration:none}
.gev span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gev.train{border-left-color:var(--accent);background:var(--accent-soft)}
.gev.routine{border-left-color:var(--good)}
.gev.done b{text-decoration:line-through}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.mgrid .h{color:var(--muted);font-weight:600;font-size:12px}
.mc{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font:inherit}
.mc .dn{font-family:var(--f-num);font-size:12px}
.mc.t{border-color:var(--accent);border-width:2px}
.mc.mk{background:var(--warn-soft)}
.mc .tr{font-size:10px;font-family:var(--f-num);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 4px;max-width:100%;overflow:hidden}
.mc .tr.done{background:var(--good);color:#fff}
.mc .tr.miss{background:var(--sunk);color:var(--muted)}
.mc .bo{font-size:10px;font-weight:700;color:var(--good)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle}
.lg.tr{background:var(--accent)} .lg.bo{background:var(--good)} .lg.mk{background:var(--warn-soft);border:1px solid var(--warn)}
.ev.done .ti b{text-decoration:line-through;text-decoration-thickness:1px}
.ev .st{font-size:12px;color:var(--muted)}
.ev.done .st{color:var(--good)}
.storecmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.storecmp div{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:12px;background:var(--surface)}
.storecmp div b{font-family:var(--f-num);font-size:14px}
.budget .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.budget .fill{height:100%;background:var(--good)}
.budget.over .fill{background:var(--warn)}
.mwarn{font-size:12px;color:var(--bad);font-weight:600}
.storecmp div .muted{font-size:10px}
.storecmp .best{border-color:var(--good);background:var(--good-soft)}
.storecmp .sel span{font-weight:700;text-decoration:underline}
.price{color:var(--ink);font-weight:600}
.nonutri .nutri,.nonutri .mbar,.nonutri .macro{display:none !important}
.ownf{background:var(--sunk)}
.mthumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.meal .mname{flex-direction:row !important;align-items:center;gap:10px}
.meal .mtx{display:flex;flex-direction:column;min-width:0}
.meal .mtx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.meal.done .mthumb{opacity:.5}
.mealopt{grid-template-columns:46px minmax(0,1fr) !important}
.mealopt .ti{display:flex;flex-direction:column}
.foldhead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%;color:var(--ink);font:inherit}
.foldhead .thumbs{display:flex}
.foldhead .thumbs .mthumb{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px;font-size:11px}
.dayplan{gap:8px;padding:12px 14px}
.prep{display:flex;flex-direction:column;gap:6px}
.prepr,.shoprecs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.shoprec{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;text-align:left;color:var(--ink);font:inherit;width:100%}
.shopg{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shopi{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 12px;border-top:1px solid var(--line)}
.shopi:first-child{border-top:0}
.shopi input{width:20px;height:20px;margin-top:2px}
.shopi.done b{text-decoration:line-through;color:var(--muted)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mhead h2{margin:0}
.meals{display:flex;flex-direction:column;gap:6px}
.meal{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--meal);border-radius:10px;padding:6px 8px;background:var(--surface)}
.meal .mdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--good);font-weight:700;padding:0}
.meal.done .mdot{border-color:var(--good);background:var(--good-soft)}
.meal .mname{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;min-width:0;color:var(--ink);font:inherit}
.meal .mname b{overflow-wrap:anywhere}
.meal.done .mname b{color:var(--muted)}
.meal .ml,.meal .mk{font-size:12px;color:var(--muted)}
.mbar .track{position:relative;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:3px}
.mbar .plan{position:absolute;inset:0 auto 0 0;background:var(--accent-soft)}
.mbar .fill{position:absolute;inset:0 auto 0 0;background:var(--good)}
.trl{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border-left:4px solid var(--accent);padding:4px 8px;border-radius:6px;background:var(--sunk)}
.dayplan.today{border-color:var(--accent)}
.calopts{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev.food{border-left-color:var(--meal)}
.gev.food{border-left-color:var(--meal)}
.task .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.task.done{background:transparent}
.task.done .dot{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.task.done .t{color:var(--muted)}
.task .t{font-weight:600}
.task .s{font-size:13px;color:var(--muted)}
.task .go{color:var(--muted);font-size:18px}
.task .mini{display:flex;gap:6px}
.task .mini input{width:78px;text-align:center;font-family:var(--f-num);padding:7px 4px}
.train{border:2px solid var(--accent);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.train.done{border-color:var(--good)}
.train .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toggle{width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--good)}
.toggle[aria-pressed="true"]::after{left:23px}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px}
.weekstrip div{border-radius:10px;padding:6px 0;background:var(--surface);border:1px solid var(--line);line-height:1.2}
.weekstrip b{display:block;font-family:var(--f-display);font-size:14px}
.weekstrip .done{background:var(--good-soft);border-color:var(--good)}
.weekstrip .plan{border-style:dashed;border-color:var(--accent)}
.weekstrip .today{outline:2px solid var(--accent)}

/* Training */
.wohead{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.wohead .clock{font-family:var(--f-num);font-size:15px}
.exl{display:flex;flex-direction:column;gap:8px}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.exrow.cur{border:2px solid var(--accent)}
.exrow.complete{opacity:.75}
.exsum{display:grid;grid-template-columns:24px 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;width:100%;background:none;border:0;text-align:left;min-width:0}
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.exhead .exalt{margin-right:8px;font-size:18px;padding:6px 10px}
.exth{width:52px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sunk)}
.exth img{width:100%;height:100%;object-fit:cover;display:block}
.exrow.cur .exth{display:none}
.exrow.cur .exsum{grid-template-columns:24px minmax(0,1fr) auto}
.pvlist{display:flex;flex-direction:column}
.pv{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pv:last-child{border-bottom:0}
.pv.off{opacity:.55}
.pvimg{border:0;padding:0;background:var(--sunk);border-radius:10px;overflow:hidden;width:84px;aspect-ratio:4/3;display:block}
.pvimg img{width:100%;height:100%;object-fit:cover;display:block}
.pvimg .noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--f-display);font-size:22px;color:var(--muted)}
.pvt{min-width:0;line-height:1.35}
.pvalt{white-space:nowrap}
.exsum .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.exrow.complete .st{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.exsum .nm{font-weight:600;min-width:0}
.exsum .pr{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.exbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.anim{position:relative;margin:0;border-radius:10px;overflow:hidden;background:#1d2421;aspect-ratio:16/9;border:0;padding:0;width:100%;display:block}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim img.b{animation:flip 2.6s ease-in-out infinite}
.anim .hint{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.anim img.b{animation:none;opacity:0}}
.target{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.target b{font-family:var(--f-num);font-weight:500}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.gate{background:var(--warn-soft);color:var(--ink)} .tag.up{background:var(--good-soft);color:var(--ink)}
.sug{border:0;background:var(--good-soft);border-radius:8px;padding:4px 10px;font-size:13px;text-align:left}
.sug.hold{background:var(--sunk)}
.setrow{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 52px;gap:8px;align-items:center}
.setrow.nokg{grid-template-columns:22px minmax(0,1fr) 52px}
.setrow .i{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:center}
.setrow input{text-align:center;font-family:var(--f-num);font-size:16px;padding:10px 4px}
.setrow .x{color:var(--muted);text-align:center}
.setrow .ok{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;color:var(--muted)}
.setrow.isdone .ok{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.setrow.isdone input{background:var(--good-soft);border-color:transparent}

function mergeDay(srv, loc){
  if (!srv) return loc;
  // Zurücksetzen verwirft nur die Trainingsdaten des Servers, alles andere wird normal zusammengeführt
  if (loc.resetAt && (!srv.resetAt || loc.resetAt > srv.resetAt)) srv = Object.assign({}, srv, {sets: {}, antag: {}, startedAt: null, finishedAt: null, where: null, swap: null, swapHome: null});
  const out = Object.assign({}, srv, loc);
  out.sets = Object.assign({}, srv.sets || {}, loc.sets || {});
  out.antag = Object.assign({}, srv.antag || {}, loc.antag || {});
  out.mobility = Object.assign({}, srv.mobility || {}, loc.mobility || {});
  out.meals = Object.assign({}, srv.meals || {}, loc.meals || {});
  out.ate = Object.assign({}, srv.ate || {}, loc.ate || {});
  out.ownDel = [...new Set([...(srv.ownDel || []), ...(loc.ownDel || [])])];
  const own = new Map(); for (const o of [...(srv.own || []), ...(loc.own || [])]) own.set(o.id, o);
  out.own = [...own.values()].filter(o => !out.ownDel.includes(o.id));
  if (!out.own.length) delete out.own; if (!out.ownDel.length) delete out.ownDel;
  out.pain = Object.assign({}, srv.pain || {}); for (const k in (loc.pain || {})) if (loc.pain[k] != null) out.pain[k] = loc.pain[k];
  for (const k of ["weight","sleep"]) if (loc[k] == null && srv[k] != null) out[k] = srv[k];
  if (!loc.note && srv.note) out.note = srv.note;
  return out;
}

}

// ---------- Fotos: verkleinert und ohne Metadaten im privaten Daten-Repo ----------
const PHOTO_POS = [["vorn","Vorn"],["seite","Seitlich"],["hinten","Hinten"]];
const PHOTO_RE = /^\d{4}-\d{2}-\d{2}-(vorn|seite|hinten)\.jpg$/;
let photoList = lsGet("photoList"), photoUrls = {}, photoDate = todayIso(), photoMsg = "", photoCmp = {};
const photoDates = () => [...new Set((photoList || []).map(f => f.name.slice(0, 10)))].sort();
async function loadPhotoList(){
  const r = await gh(`contents/data/photos?ref=${CFG.branch}`);
  if (r.status === 404) photoList = [];
  else if (r.ok) photoList = (await r.json()).filter(f => PHOTO_RE.test(f.name)).map(f => ({name:f.name, sha:f.sha}));
  else throw new Error(`${r.status} beim Laden der Fotos`);
  lsSet("photoList", photoList);
}
async function photoUrl(name){
  if (photoUrls[name]) return photoUrls[name];
  const r = await gh(`contents/data/photos/${name}?ref=${CFG.branch}`, {headers:{Accept:"application/vnd.github.raw+json"}});
  if (!r.ok) throw new Error(r.status);
  return photoUrls[name] = URL.createObjectURL(await r.blob());
}
async function shrinkPhoto(file){
  // Neu zeichnen entfernt EXIF-Daten wie den Aufnahmeort
  let src = await createImageBitmap(file, {imageOrientation:"from-image"}).catch(() => null);
  if (!src) src = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("Bild nicht lesbar")); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(src.width, src.height)), c = document.createElement("canvas");
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
  const b = new Uint8Array(await blob.arrayBuffer()); let r = "";
  for (let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(r);
}
async function uploadPhoto(date, pos, file){
  const name = `${date}-${pos}.jpg`, cur0 = await gh(`contents/data/photos/${name}?ref=${CFG.branch}`), ex = cur0.ok ? await cur0.json() : null;
  const r = await gh(`contents/data/photos/${name}`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:"Foto", content:await shrinkPhoto(file), branch:CFG.branch, ...(ex ? {sha:ex.sha} : {})})});
  if (!r.ok) throw new Error(`${r.status} beim Hochladen`);
  if (photoUrls[name]) { URL.revokeObjectURL(photoUrls[name]); delete photoUrls[name]; }
  await loadPhotoList();
}
async function deletePhoto(name){
  const ex = (photoList || []).find(f => f.name === name); if (!ex) return;
  const r = await gh(`contents/data/photos/${name}`, {method:"DELETE", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:"Foto gelöscht", sha:ex.sha, branch:CFG.branch})});
  if (!r.ok) throw new Error(`${r.status} beim Löschen`);
  if (photoUrls[name]) URL.revokeObjectURL(photoUrls[name]);
  delete photoUrls[name]; await loadPhotoList();
}
function photoSlot(name, label, act){
  const has = (photoList || []).some(f => f.name === name);
  return `<div class="ph"><div class="phcap">${esc(label)}</div>${has ? `<button type="button" class="phbox" data-sheet="photo" data-v="${name}" data-ph="${name}" aria-label="${esc(label)} groß anzeigen">lädt …</button>` : `<div class="phbox">noch kein Foto</div>`}${act || ""}</div>`;
}
function photosHtml(){
  if (!token) return "";
  const list = photoList || [], dates = photoDates(), cf = pendingConfirm;
  let h = `<div class="card" id="photos"><h2>Fotos</h2><div class="small muted">Woche 0, 6 und 12: vorn, seitlich, hinten. Gleicher Ort, gleiches Licht, 2,5–3 m Abstand. Die Fotos werden verkleinert, ohne Standortdaten und nur in deinem privaten Daten-Repo gespeichert.</div>
    <div class="field"><label for="phDate">Datum</label><input type="date" id="phDate" value="${photoDate}"></div><div class="phgrid">`;
  for (const [k, l] of PHOTO_POS) { const name = `${photoDate}-${k}.jpg`, has = list.some(f => f.name === name);
    h += photoSlot(name, l, `<label class="btn small">${has ? "Ersetzen" : "＋ Foto"}<input type="file" accept="image/*" data-phup="${k}" hidden></label>${has ? `<button class="btn ghost small ${cf === "ph:" + name ? "danger" : ""}" type="button" data-phdel="${name}">${cf === "ph:" + name ? "Sicher?" : "Löschen"}</button>` : ""}`); }
  h += `</div>${photoMsg ? `<div class="small">${esc(photoMsg)}</div>` : ""}`;
  if (dates.length >= 2) {
    const a = photoCmp.a && dates.includes(photoCmp.a) ? photoCmp.a : dates[0], b = photoCmp.b && dates.includes(photoCmp.b) ? photoCmp.b : dates[dates.length - 1];
    const sel = (id, v) => `<select id="${id}">${dates.map(d => `<option value="${d}" ${d === v ? "selected" : ""}>${fmt(d)}</option>`).join("")}</select>`;
    h += `<div class="lab">Vergleich</div><div class="grid2"><div class="field"><label for="phA">Vorher</label>${sel("phA", a)}</div><div class="field"><label for="phB">Nachher</label>${sel("phB", b)}</div></div>`;
    for (const [k, l] of PHOTO_POS) h += `<div class="phcap">${esc(l)}</div><div class="phgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${photoSlot(`${a}-${k}.jpg`, fmt(a))}${photoSlot(`${b}-${k}.jpg`, fmt(b))}</div>`;
  } else if (dates.length === 1) h += `<div class="small muted">Ab dem zweiten Fototermin erscheint hier ein Vorher-Nachher-Vergleich.</div>`;
  return h + `</div>`;
}
function hydratePhotos(){
  for (const el of view.querySelectorAll("[data-ph]")) { const name = el.dataset.ph;
    photoUrl(name).then(u => { if (el.isConnected) el.innerHTML = `<img src="${u}" alt="">`; }).catch(() => { if (el.isConnected) el.textContent = "nicht ladbar"; }); }
}

    quiz:{q:"Welches Frühstück bringt dich am ehesten auf 30–40 g Protein?", a:["Brötchen mit Marmelade","Overnight Oats mit 300 g Skyr","Müsli mit Hafermilch"], c:1, why:"300 g Skyr liefern allein etwa 33 g Protein."}},
  {id:"l9", week:9, title:"Schlaf und Stress", min:3, body:[
    "Muskeln wachsen in der Erholung, nicht im Gym.",
    "• Ziel: 7 Stunden Schlaf oder mehr, feste Aufstehzeit ±30 min, Koffein spätestens 8 h vor dem Schlafen.",
    "• Eine Nacht ohne Schlaf senkt die Muskelproteinsynthese um etwa 18 %.",
    "• Nach einer schlechten Nacht trotzdem trainieren, aber 1–2 Sätze weniger und RIR +1.",
    "• Prüfungsphase? Modus „reduziert“: 2 Einheiten, weniger Sätze, Lasten bleiben. So hältst du deine Kraft."],
    quiz:{q:"Prüfungswoche, Stress 8/10. Was ist sinnvoll?", a:["Training komplett aussetzen","Modus „reduziert“: 2 kurze Einheiten","Mehr trainieren zum Abschalten"], c:1, why:"Mit wenig Volumen und gleicher Intensität bleiben Kraft und Muskeln erhalten."}},
  {id:"l10", week:10, title:"Nie zweimal auslassen", min:3, body:[
    "Eine Gewohnheit braucht im Schnitt 66 Tage, nicht 21. Einzelne Aussetzer schaden kaum, Serien schon.",
    "• Regel: nie zwei geplante Einheiten hintereinander ausfallen lassen.",
    "• Verpasstes wird nicht nachgeholt, sondern verschoben. Der Planer macht das automatisch.",
    "• Wenn-Dann-Pläne wirken: „Wenn die Vorlesung um 17 Uhr endet, dann gehe ich direkt ins Gym.“",
    "• 2-Minuten-Regel an schlechten Tagen: umziehen und einen Satz machen."],
    quiz:{q:"Du hast gestern ausgelassen. Was ist heute am wichtigsten?", a:["Doppelt so viel trainieren","Heute wenigstens kurz trainieren","Bis nächste Woche warten"], c:1, why:"Einmal ist egal, zweimal ist der Anfang vom Abbruch."}},
  {id:"l11", week:11, title:"Bouldern und Krafttraining", min:4, body:[
    "Bouldern ergänzt dein Training, ersetzt aber kein Rückentraining im Gym.",
    "• Weißt du es vorher: am Tag vor dem Bouldern kein schweres Bein- oder Zugtraining. Spontan nach schwerem Training: nur locker und statisch klettern, früh aufhören.",
    "• Am Tag danach kein schweres Ziehen (der Planer legt dann keine Oberkörper-Einheit).",
    "• Bis zur Arztfreigabe: keine Dynos, Mantles, Compression-Züge. Offene Griffe, bei Ermüdung aufhören.",
    "• Knie: keine extremen Drop Knees und keine maximalen Heel Hooks, solange das Knie gereizt ist. Ein Pop mit Schmerz hinten am Knie gehört abgeklärt.",
    "• Nach dem Bouldern 10 min Antagonisten (Push-up Plus, Außenrotation, Reverse Wrist Curls) gegen Schulter- und Ellbogenprobleme.",
    "• Ein „Pop“ im Finger mit Schwellung muss abgeklärt werden."],
    quiz:{q:"Morgen willst du bouldern. Was passt heute?", a:["Schwere Klimmzüge","Ruhetag oder nur die Korrektiv-Routine","Schwere Beineinheit"], c:1, why:"Am Tag vor dem Bouldern weder schweres Ziehen noch schwere Beine: Beides erhöht das Verletzungsrisiko an der Wand."}},
  {id:"l12", week:12, title:"Wie geht es nach Woche 12 weiter?", min:3, body:[
    "Glückwunsch: ein kompletter Block. Jetzt vergleichst du mit Woche 0: Maße, Fotos, Kraft, Schmerztrend.",
    "• Nächster Block: gleiche Struktur, Übungen mit Fortschritt behalten, stagnierende tauschen.",
    "• Ernährung: ab jetzt Lean Bulk mit etwa +200–250 kcal, Ziel +0,5–1 kg pro Monat.",
    "• Wächst die Taille über 1 cm pro Monat ohne Kraftzuwachs, wieder 150 kcal runter.",
    "• Mit Arztfreigabe kommen Überkopf und Dips stufenweise dazu."],
    quiz:{q:"Du nimmst 2 kg im Monat zu, die Kraft stagniert. Was tun?", a:["Weiter so","Etwa 150 kcal weniger","Mehr Protein-Pulver"], c:1, why:"Mehr als 1,5 kg pro Monat ist überwiegend Fett."}},

  if (!deep) return;

function readHash(){
  const k = location.hash.match(/[#&]([wmpc])=(\d{4}-\d{2}-\d{2})/);
  if (k) { const typ = k[1], dte = k[2]; cur = null; deep = null;
    if (typ === "c") { selDate = todayIso(); tab = "heute"; deep = ["checkin", dte]; }
    else { selDate = dte; tab = typ === "w" ? "training" : "heute"; if (typ === "w") { woSession = null; openEx = null; } else deep = [typ === "m" ? "mob" : "pain"]; }
    return; }
  const e = location.hash.match(/[#&]e=(\d{4}-\d{2}-\d{2})/); if (e) { tab = "essen"; essenView = "plan"; essenMon = monday(e[1]); openDays = {mo: essenMon, set: new Set([e[1]])}; return; }
  const m = location.hash.match(/d=(\d{4}-\d{2}-\d{2})/); if (m) { selDate = m[1]; tab = "heute"; cur = null; }
  const t = location.hash.match(/t=(\w+)/); if (t) { const k = t[1];
    if (["heute","training","essen","fortschritt","mehr"].includes(k)) tab = k;
    else if (["reise","weg","lektionen"].includes(k)) { tab = "fortschritt"; sub.fortschritt = "reise"; if (k !== "reise") sub.reise = k; }
    else if (["einkauf","rezepte"].includes(k)) { tab = "essen"; essenView = k; }
    else if (["messen","checkin","verlauf"].includes(k)) { tab = "fortschritt"; sub.fortschritt = k === "verlauf" ? "uebersicht" : k; }
    else if (["kalender","plan","setup"].includes(k)) { tab = "mehr"; sub.mehr = k; } }
}

function lineChart(series, o){
  const W = 640, H = 190, L = 36, R = 12, T = 12, B = 26, xs = o.dates, n = xs.length;
  const all = series.flatMap(s => s.pts.map(p => p.v)).filter(v => v != null);
  if (!all.length) return `<p class="muted small" style="margin:0">${esc(o.empty)}</p>`;
  let lo_ = o.min ?? Math.min(...all), hi = o.max ?? Math.max(...all); if (hi - lo_ < 1) { lo_ -= .5; hi += .5; }
  const X = i => L + (n === 1 ? 0 : i/(n-1)) * (W-L-R), Y = v => T + (1 - (v-lo_)/(hi-lo_)) * (H-T-B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  for (const t of (o.ticks || [lo_,(lo_+hi)/2,hi])) s += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${Number.isInteger(t) ? t : t.toFixed(1)}</text>`;
  [0, Math.floor((n-1)/2), n-1].forEach(i => s += `<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-size="11" fill="var(--muted)">${fmt(xs[i]).slice(3)}</text>`);
  for (const se of series) { const pts = se.pts.map((p,i) => p.v == null ? null : [X(i), Y(p.v)]);
    if (se.dots) pts.forEach(p => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${se.color}" opacity=".45"/>`; });
    if (se.line) { let d = "", on = false; pts.forEach(p => { if (!p) { on = false; return; } d += (on ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); on = true; }); s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`; const lp = [...pts].reverse().find(Boolean); if (lp) s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${se.color}"/>`; } }
  return s + `</svg>`;
}
function weekCount(mo){ let c = 0; for (let j = 0; j < 7; j++) if (isStrength(store.days[addDays(mo,j)])) c++; return c; }
function streak(){ let mo = monday(todayIso()), n = 0; if (weekCount(mo) >= 2) n++; mo = addDays(mo,-7); while (weekCount(mo) >= 2) { n++; mo = addDays(mo,-7); } return n; }
function records(){
  const t = todayIso(), from = addDays(t, -30), out = [];

    for (const [d, day] of Object.entries(store.days)) { const s = (day.sets?.[id] || []).filter(doneSet); if (!s.length) continue;
